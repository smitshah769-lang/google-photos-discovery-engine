[project]
name = "photos-discovery-engine"
version = "0.1.0"
description = "One-time AI discovery engine for Google Photos retrieval feedback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "click>=8.1",
  "beautifulsoup4>=4.12",
  "certifi>=2024.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
analysis = [
  "sentence-transformers>=3.0",
  "transformers>=4.40",
]

[project.scripts]
discovery = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
